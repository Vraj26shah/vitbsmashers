<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile | Scholars Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0a1423;
      --bg2: #0f1a2a;
      --primary: #3498db;
      --accent: #2ecc71;
      --text: #ecf0f1;
      --muted: #aebdcc;
      --glass: rgba(10, 24, 42, 0.9);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      padding: 22px;
    }
    .card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 2px solid var(--primary);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      padding: 34px;
      width: 100%;
      max-width: 560px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }
    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--text);
    }
    .step-chip {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(46, 204, 113, 0.4);
      background: rgba(46, 204, 113, 0.12);
      color: #8ef0b4;
      font-size: 12px;
      font-weight: 600;
    }
    h2 {
      font-size: 40px;
      margin-bottom: 6px;
      color: #fff;
      line-height: 1.1;
      font-family: 'Montserrat', sans-serif;
    }
    .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(52, 152, 219, 0.08);
      border: 1.5px solid rgba(52, 152, 219, 0.3);
      border-radius: 10px;
      color: var(--text);
      font-size: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }
    select option { background: #0f1a2a; }
    .error-msg {
      font-size: 12px;
      color: #e74c3c;
      margin-top: 4px;
      display: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 18px rgba(52, 152, 219, 0.3);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(52, 152, 219, 0.42);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #e74c3c; }
    .alert.success { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; color: #2ecc71; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-title">Scholars Stack</div>
    <div class="step-chip">Complete Profile</div>
  </div>
  <h2>Almost there!</h2>
  <p class="subtitle">Fill in your details to start using Scholars Stack.</p>

  <div class="alert error" id="alertError"></div>
  <div class="alert success" id="alertSuccess"></div>

  <form id="profileForm" novalidate>
    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="e.g. Vraj Shah" autocomplete="name">
      <div class="error-msg" id="errFullName">Enter your full name.</div>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">
      <div class="error-msg" id="errPhone">Enter a valid 10-digit number.</div>
    </div>

    <div class="field">
      <label for="regNum">Registration Number</label>
      <input type="text" id="regNum" placeholder="e.g. 23BCE00001" maxlength="12" style="text-transform:uppercase">
      <div class="error-msg" id="errRegNum">Format: 23BCE00001</div>
    </div>

    <div class="field">
      <label for="branch">Branch / Program</label>
      <select id="branch">
        <option value="">— Select your branch —</option>
        <option value="B.Tech CSE">B.Tech CSE</option>
        <option value="B.Tech CSE (AI&ML)">B.Tech CSE (AI&amp;ML)</option>
        <option value="B.Tech CSE (Data Science)">B.Tech CSE (Data Science)</option>
        <option value="B.Tech CSE (IoT)">B.Tech CSE (IoT)</option>
        <option value="B.Tech CSE (Cyber Security)">B.Tech CSE (Cyber Security)</option>
        <option value="B.Tech ECE">B.Tech ECE</option>
        <option value="B.Tech EEE">B.Tech EEE</option>
        <option value="B.Tech Mechanical">B.Tech Mechanical</option>
        <option value="B.Tech Civil">B.Tech Civil</option>
        <option value="B.Tech Chemical">B.Tech Chemical</option>
        <option value="B.Tech Bioinformatics">B.Tech Bioinformatics</option>
        <option value="MBA">MBA</option>
        <option value="MCA">MCA</option>
        <option value="M.Tech">M.Tech</option>
      </select>
      <div class="error-msg" id="errBranch">Please select your branch.</div>
    </div>

    <button type="submit" class="btn" id="submitBtn">Save & Continue</button>
  </form>
</div>

<script src="../../config.js"></script>
<script>
  const API_BASE = window.config?.API_BASE || 'http://localhost:4000/api/v1';
  const token = localStorage.getItem('token');
  const DEFAULT_REDIRECT = '/features/marketplace/market.html?sidebar=active';
  const PROFILE_REDIRECT = '/features/profile/profile.html?sidebar=active';

  function getPostCompletionRedirect() {
    const params = new URLSearchParams(window.location.search);
    const source = (params.get('source') || '').trim().toLowerCase();
    if (source === 'profile') return PROFILE_REDIRECT;
    return DEFAULT_REDIRECT;
  }

  const postCompletionRedirect = getPostCompletionRedirect();

  try {
    localStorage.setItem('profileCompletionReturnTo', postCompletionRedirect);
  } catch (_) {}

  function hasCompletedProfile(data) {
    if (!data) return false;
    const hasValue = (value) => typeof value === 'string' ? value.trim().length > 0 : !!value;
    return data.profile_completed === true ||
      data.profileComplete === true ||
      data.profileCompleted === true ||
      (
        hasValue(data.phone) &&
        hasValue(data.registration_number || data.registrationNumber || data.regNumber) &&
        hasValue(data.branch || data.program)
      );
  }

  function redirectToResolvedSource() {
    try {
      localStorage.removeItem('profileCompletionReturnTo');
    } catch (_) {}
    window.location.replace(postCompletionRedirect);
  }

  if (!token) {
    window.location.href = '/index.html';
  }

  // If profile is already complete, skip this page and redirect immediately.
  try {
    const cachedProfile = JSON.parse(localStorage.getItem('profileData') || '{}');
    const cachedUser = JSON.parse(localStorage.getItem('userProfile') || '{}');
    if (hasCompletedProfile(cachedProfile) || hasCompletedProfile(cachedUser) || localStorage.getItem('profileCompleted') === 'true') {
      redirectToResolvedSource();
    }
  } catch (_) {}

  (async () => {
    try {
      const res = await fetch(`${API_BASE}/profile/me`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
      });
      if (!res.ok) return;
      const data = await res.json();
      const user = data?.data?.user || data?.user || null;
      if (!user || !hasCompletedProfile(user)) return;

      localStorage.setItem('userProfile', JSON.stringify(user));
      localStorage.setItem('profileCompleted', 'true');
      try {
        const existingProfileData = JSON.parse(localStorage.getItem('profileData') || '{}');
        localStorage.setItem('profileData', JSON.stringify({
          ...existingProfileData,
          email: user.email || existingProfileData.email || '',
          phone: user.phone || existingProfileData.phone || '',
          regNumber: user.registration_number || user.registrationNumber || user.regNumber || existingProfileData.regNumber || '',
          registrationNumber: user.registration_number || user.registrationNumber || user.regNumber || existingProfileData.registrationNumber || '',
          program: user.branch || user.program || existingProfileData.program || '',
          branch: user.branch || user.program || existingProfileData.branch || '',
          fullName: user.full_name || user.fullName || existingProfileData.fullName || '',
          profileCompleted: true,
          lastUpdated: new Date().toISOString()
        }));
      } catch (_) {}

      redirectToResolvedSource();
    } catch (_) {}
  })();

  // Pre-fill name from stored profile if available
  try {
    const stored = JSON.parse(localStorage.getItem('userProfile') || '{}');
    const name = stored.full_name || stored.fullName || '';
    if (name) document.getElementById('fullName').value = name;
  } catch (_) {}

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideErr(id) { document.getElementById(id).style.display = 'none'; }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const phone    = document.getElementById('phone').value.trim().replace(/\s+/g, '');
    const regNum   = document.getElementById('regNum').value.trim().toUpperCase();
    const branch   = document.getElementById('branch').value;

    let valid = true;

    if (!fullName) { showErr('errFullName', 'Enter your full name.'); valid = false; } else hideErr('errFullName');
    if (!/^\d{10}$/.test(phone)) { showErr('errPhone', 'Enter a valid 10-digit number.'); valid = false; } else hideErr('errPhone');
    if (!/^\d{2}[A-Z]{3}\d{5}$/.test(regNum)) { showErr('errRegNum', 'Format: 23BCE00001'); valid = false; } else hideErr('errRegNum');
    if (!branch) { showErr('errBranch', 'Please select your branch.'); valid = false; } else hideErr('errBranch');

    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const alertError   = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');
    alertError.style.display = 'none';
    alertSuccess.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/profile/update`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({
          full_name:           fullName,
          phone:               phone,
          registration_number: regNum,
          branch:              branch,
        }),
      });

      const data = await res.json();

      if (data.status === 'success') {
        const savedUser = data.data?.user || {};
        localStorage.setItem('userProfile', JSON.stringify(savedUser));
        localStorage.setItem('profileCompleted', 'true');
        try {
          const existingProfileData = JSON.parse(localStorage.getItem('profileData') || '{}');
          const mergedProfileData = {
            ...existingProfileData,
            email: savedUser.email || existingProfileData.email || '',
            phone: savedUser.phone || phone,
            regNumber: savedUser.registration_number || savedUser.registrationNumber || regNum,
            registrationNumber: savedUser.registration_number || savedUser.registrationNumber || regNum,
            program: savedUser.branch || existingProfileData.program || branch,
            branch: savedUser.branch || existingProfileData.branch || branch,
            fullName: savedUser.full_name || savedUser.fullName || fullName,
            profileCompleted: true,
            lastUpdated: new Date().toISOString()
          };
          localStorage.setItem('profileData', JSON.stringify(mergedProfileData));
        } catch (_) {}

        window.dispatchEvent(new CustomEvent('profileCompleted'));
        alertSuccess.textContent = 'Profile saved! Redirecting you back…';
        alertSuccess.style.display = 'block';
        setTimeout(() => {
          try {
            localStorage.removeItem('profileCompletionReturnTo');
          } catch (_) {}
          window.location.href = postCompletionRedirect;
        }, 1200);
      } else {
        alertError.textContent = data.message || 'Failed to save profile.';
        alertError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Save & Continue';
      }
    } catch (err) {
      alertError.textContent = 'Network error. Please try again.';
      alertError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Save & Continue';
    }
  });
</script>
</body>
</html>
