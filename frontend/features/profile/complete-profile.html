<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile | Scholars Stack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a1423 0%, #0f1a2a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ecf0f1;
    }
    .card {
      background: rgba(15, 26, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid #3498db;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 6px;
      color: #fff;
    }
    .subtitle {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 32px;
    }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3498db;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(52, 152, 219, 0.08);
      border: 1.5px solid rgba(52, 152, 219, 0.3);
      border-radius: 10px;
      color: #ecf0f1;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #3498db; }
    select option { background: #0f1a2a; }
    .error-msg {
      font-size: 12px;
      color: #e74c3c;
      margin-top: 4px;
      display: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #e74c3c; }
    .alert.success { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; color: #2ecc71; }
  </style>
</head>
<body>
<div class="card">
  <h2>Almost there!</h2>
  <p class="subtitle">Fill in your details to start using Scholars Stack.</p>

  <div class="alert error" id="alertError"></div>
  <div class="alert success" id="alertSuccess"></div>

  <form id="profileForm" novalidate>
    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="e.g. Vraj Shah" autocomplete="name">
      <div class="error-msg" id="errFullName">Enter your full name.</div>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">
      <div class="error-msg" id="errPhone">Enter a valid 10-digit number.</div>
    </div>

    <div class="field">
      <label for="regNum">Registration Number</label>
      <input type="text" id="regNum" placeholder="e.g. 23BCE00001" maxlength="12" style="text-transform:uppercase">
      <div class="error-msg" id="errRegNum">Format: 23BCE00001</div>
    </div>

    <div class="field">
      <label for="branch">Branch / Program</label>
      <select id="branch">
        <option value="">— Select your branch —</option>
        <option value="B.Tech CSE">B.Tech CSE</option>
        <option value="B.Tech CSE (AI&ML)">B.Tech CSE (AI&amp;ML)</option>
        <option value="B.Tech CSE (Data Science)">B.Tech CSE (Data Science)</option>
        <option value="B.Tech CSE (IoT)">B.Tech CSE (IoT)</option>
        <option value="B.Tech CSE (Cyber Security)">B.Tech CSE (Cyber Security)</option>
        <option value="B.Tech ECE">B.Tech ECE</option>
        <option value="B.Tech EEE">B.Tech EEE</option>
        <option value="B.Tech Mechanical">B.Tech Mechanical</option>
        <option value="B.Tech Civil">B.Tech Civil</option>
        <option value="B.Tech Chemical">B.Tech Chemical</option>
        <option value="B.Tech Bioinformatics">B.Tech Bioinformatics</option>
        <option value="MBA">MBA</option>
        <option value="MCA">MCA</option>
        <option value="M.Tech">M.Tech</option>
      </select>
      <div class="error-msg" id="errBranch">Please select your branch.</div>
    </div>

    <button type="submit" class="btn" id="submitBtn">Save & Continue</button>
  </form>
</div>

<script src="../../config.js"></script>
<script>
  const API_BASE = window.config?.API_BASE || 'http://localhost:4000/api/v1';
  const token = localStorage.getItem('token');

  if (!token) {
    window.location.href = '/index.html';
  }

  // Pre-fill name from stored profile if available
  try {
    const stored = JSON.parse(localStorage.getItem('userProfile') || '{}');
    const name = stored.full_name || stored.fullName || '';
    if (name) document.getElementById('fullName').value = name;
  } catch (_) {}

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideErr(id) { document.getElementById(id).style.display = 'none'; }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const phone    = document.getElementById('phone').value.trim().replace(/\s+/g, '');
    const regNum   = document.getElementById('regNum').value.trim().toUpperCase();
    const branch   = document.getElementById('branch').value;

    let valid = true;

    if (!fullName) { showErr('errFullName', 'Enter your full name.'); valid = false; } else hideErr('errFullName');
    if (!/^\d{10}$/.test(phone)) { showErr('errPhone', 'Enter a valid 10-digit number.'); valid = false; } else hideErr('errPhone');
    if (!/^\d{2}[A-Z]{3}\d{5}$/.test(regNum)) { showErr('errRegNum', 'Format: 23BCE00001'); valid = false; } else hideErr('errRegNum');
    if (!branch) { showErr('errBranch', 'Please select your branch.'); valid = false; } else hideErr('errBranch');

    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const alertError   = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');
    alertError.style.display = 'none';
    alertSuccess.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/profile/update`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({
          full_name:           fullName,
          phone:               phone,
          registration_number: regNum,
          branch:              branch,
        }),
      });

      const data = await res.json();

      if (data.status === 'success') {
        localStorage.setItem('userProfile', JSON.stringify(data.data?.user || {}));
        alertSuccess.textContent = 'Profile saved! Taking you to the marketplace…';
        alertSuccess.style.display = 'block';
        setTimeout(() => { window.location.href = '/features/marketplace/market.html'; }, 1200);
      } else {
        alertError.textContent = data.message || 'Failed to save profile.';
        alertError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Save & Continue';
      }
    } catch (err) {
      alertError.textContent = 'Network error. Please try again.';
      alertError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Save & Continue';
    }
  });
</script>
</body>
</html>
