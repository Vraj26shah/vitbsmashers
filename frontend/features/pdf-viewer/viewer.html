<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Notes — Scholars Stack</title>
  <link href='https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script src="../../config.js"></script>
  <script src="../../content-protection.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    :root {
      --primary-dark: #0f1a2a;
      --accent-blue:  #3498db;
      --accent-teal:  #2ecc71;
      --light-color:  #ecf0f1;
      --danger-color: #e74c3c;
      --sidebar-w:    260px;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

    body {
      background: linear-gradient(135deg,#0a1423 0%,var(--primary-dark) 100%);
      color: var(--light-color);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .viewer-header {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px;
      height: 56px; flex-shrink: 0;
      background: rgba(15,26,42,0.97);
      border-bottom: 2px solid var(--accent-blue);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 300;
    }

    .btn-icon {
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid rgba(52,152,219,0.35);
      color: #aaa; width: 34px; height: 34px;
      border-radius: 8px; font-size: 20px;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .btn-icon:hover { border-color: var(--accent-blue); color: #fff; }

    .btn-back {
      display: flex; align-items: center; gap: 5px;
      background: transparent;
      border: 1px solid rgba(52,152,219,0.35);
      color: #aaa; padding: 5px 13px;
      border-radius: 8px; font-size: 13px;
      font-family: 'Poppins',sans-serif;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-back:hover { border-color: var(--accent-blue); color: #fff; }

    .file-name {
      flex: 1; font-weight: 600; font-size: 14px;
      color: var(--light-color);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .protection-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--accent-teal);
      background: rgba(46,204,113,0.1);
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(46,204,113,0.25);
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── Body ── */
    .viewer-body {
      display: flex; flex: 1; overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      display: flex; flex-direction: column;
      background: #0b1624;
      border-right: 1px solid rgba(52,152,219,0.2);
      overflow: hidden;
      transition: width 0.25s ease;
    }
    .sidebar.collapsed { width: 0; }

    .sidebar-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(52,152,219,0.15);
      flex-shrink: 0;
    }
    .sidebar-header h4 {
      font-size: 11px; font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .sidebar-list {
      flex: 1; overflow-y: auto; padding: 6px 0 12px;
    }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: rgba(52,152,219,0.3); border-radius:4px; }

    .group-label {
      padding: 8px 14px 4px;
      font-size: 10px; font-weight: 700;
      color: #6a8aaa; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .sb-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .sb-item:hover { background: rgba(52,152,219,0.1); }
    .sb-item.active {
      background: rgba(52,152,219,0.15);
      border-left-color: var(--accent-blue);
    }
    .sb-item.no-file { opacity: 0.45; cursor: default; }
    .sb-item.no-file:hover { background: transparent; }

    .sb-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .sb-icon.pdf  { color: #e74c3c; }
    .sb-icon.lock { color: #7f8c8d; font-size: 12px; }

    .sb-title {
      font-size: 12px; line-height: 1.4; color: #cdd6e0;
    }
    .sb-item.active .sb-title { color: #fff; font-weight: 600; }
    .sb-badge {
      font-size: 10px; color: #6a8aaa; margin-top: 1px;
      white-space: nowrap; flex-shrink: 0; align-self: flex-start;
    }

    /* ── PDF panel ── */
    .pdf-panel {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Toolbar ── */
    #viewer-toolbar {
      display: none;
      align-items: center; gap: 4px;
      padding: 0 14px; height: 40px; flex-shrink: 0;
      background: #121f30;
      border-bottom: 1px solid rgba(52,152,219,0.25);
    }

    .tb-sep { width:1px; height:20px; background:rgba(255,255,255,0.1); margin:0 4px; flex-shrink:0; }

    .tb-btn {
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: #bbb;
      width: 28px; height: 28px; border-radius: 6px;
      font-size: 17px; cursor: pointer;
      transition: background 0.15s, color 0.15s; flex-shrink: 0;
    }
    .tb-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; }
    .tb-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .page-nav { display:flex; align-items:center; gap:4px; font-size:12px; color:#ccc; white-space:nowrap; }

    #page-input {
      width: 40px; padding: 2px 0; text-align:center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 5px; color:#fff;
      font-size: 12px; font-family:'Poppins',sans-serif;
      -moz-appearance: textfield;
    }
    #page-input::-webkit-outer-spin-button,
    #page-input::-webkit-inner-spin-button { -webkit-appearance:none; }
    #page-input:focus { outline:none; border-color:var(--accent-blue); }

    #zoom-select {
      padding: 3px 5px; min-width: 90px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 5px; color:#fff;
      font-size: 12px; font-family:'Poppins',sans-serif; cursor:pointer;
    }
    #zoom-select:focus { outline:none; border-color:var(--accent-blue); }
    #zoom-select option { background:#172236; color:#fff; }

    /* ── PDF viewer area (always in layout → clientWidth always valid) ── */
    #viewer-wrapper {
      flex: 1; position: relative;
      overflow-y: auto; overflow-x: auto;
      background: #525659;
    }

    /* Loading/error overlays sit inside the PDF area */
    .pdf-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 2rem;
      background: rgba(10,20,35,0.88);
      z-index: 10;
    }
    .pdf-overlay h2 { font-size: 1.3rem; }
    .pdf-overlay p  { color:#aaa; max-width:400px; line-height:1.6; font-size:13px; }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(52,152,219,0.15);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    #loading-progress { font-size:12px; color:#aaa; margin-top:-6px; }

    .btn-primary {
      display: inline-flex; align-items:center; gap:8px;
      margin-top:6px; padding:9px 20px;
      background: var(--accent-blue); color:#fff;
      text-decoration:none; border-radius:10px;
      font-weight:600; font-size:13px; transition:opacity 0.15s;
    }
    .btn-primary:hover { opacity:0.85; }

    #pdf-pages {
      display: flex; flex-direction:column;
      align-items: center;
      padding: 20px 0; gap: 12px;
      min-height: 100%;
    }

    .pdf-page-wrap {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-shrink: 0; line-height: 0;
    }

    #pdf-pages canvas {
      display: block;
      -webkit-user-select:none; -moz-user-select:none; user-select:none;
      -webkit-user-drag: none;
    }

    #watermark-canvas {
      position: fixed; top: 56px; left: 0;
      width: 100%; height: calc(100vh - 56px);
      pointer-events: none; z-index: 100;
    }

    #viewer-wrapper.blurred { filter: blur(18px); }

    @media (max-width: 600px) {
      .sidebar { width: 0; }
      .sidebar.mobile-open { width: var(--sidebar-w); position:absolute; top:0; left:0; height:100%; z-index:200; }
    }

    @media print { * { display:none !important; } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="viewer-header">
    <button class="btn-icon" id="btn-sidebar-toggle" title="Toggle file tree" onclick="toggleSidebar()">
      <i class='bx bx-menu'></i>
    </button>
    <button class="btn-back" onclick="window.close()">
      <i class='bx bx-arrow-back'></i> Back
    </button>
    <span id="file-name" class="file-name">Loading…</span>
    <div class="protection-badge">
      <i class='bx bxs-lock-alt'></i> Protected
    </div>
  </div>

  <!-- Body: sidebar + pdf panel -->
  <div class="viewer-body">

    <!-- Sidebar — file tree -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4>Course Files</h4>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div style="padding:20px 14px; font-size:12px; color:#6a8aaa;">Loading files…</div>
      </div>
    </div>

    <!-- PDF panel -->
    <div class="pdf-panel">

      <!-- Toolbar (hidden until first PDF loads) -->
      <div id="viewer-toolbar">
        <button class="tb-btn" id="btn-prev" title="Previous page" onclick="goToPage(currentPageNum - 1)" disabled>
          <i class='bx bx-chevron-left'></i>
        </button>
        <div class="page-nav">
          <input type="number" id="page-input" value="1" min="1" />
          <span>/ <span id="total-pages">—</span></span>
        </div>
        <button class="tb-btn" id="btn-next" title="Next page" onclick="goToPage(currentPageNum + 1)" disabled>
          <i class='bx bx-chevron-right'></i>
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" title="Zoom out  Ctrl+−" onclick="zoomStep(-1)">
          <i class='bx bx-minus'></i>
        </button>
        <select id="zoom-select" onchange="onZoomSelect(this.value)">
          <option value="fit-width">Fit Width</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1.0">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="1.75">175%</option>
          <option value="2.0">200%</option>
          <option value="3.0">300%</option>
        </select>
        <button class="tb-btn" title="Zoom in  Ctrl++" onclick="zoomStep(+1)">
          <i class='bx bx-plus'></i>
        </button>
      </div>

      <!-- PDF viewer (always in layout so clientWidth is valid) -->
      <div id="viewer-wrapper">

        <!-- Loading overlay -->
        <div id="loading-state" class="pdf-overlay">
          <div class="spinner"></div>
          <h2>Verifying Access…</h2>
          <p>Checking your purchase and loading the document securely.</p>
          <div id="loading-progress"></div>
        </div>

        <!-- Error overlay -->
        <div id="error-state" class="pdf-overlay" style="display:none;">
          <div style="font-size:52px;">🚫</div>
          <h2 id="error-title" style="color:var(--danger-color);">Access Denied</h2>
          <p id="error-message">You do not have permission to view this file.</p>
          <a href="/features/mycourses/mycourses.html" class="btn-primary">
            <i class='bx bx-book'></i> Back to My Courses
          </a>
        </div>

        <canvas id="watermark-canvas"></canvas>
        <div id="pdf-pages"></div>

      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ── URL params ──
    const params   = new URLSearchParams(window.location.search);
    const courseId = params.get('courseId');
    let   fileId   = params.get('fileId');
    const fileName = params.get('fileName') || 'Course Notes';

    document.getElementById('file-name').textContent = fileName;
    document.title = `${fileName} — Scholars Stack`;

    // ── Helpers ──
    function getApiBase() { return window.config ? window.config.API_BASE : '/api/v1'; }
    function getToken()   { return localStorage.getItem('token'); }
    function getUserEmail() {
      try { const u = JSON.parse(localStorage.getItem('user')||'{}'); return u.email||u.username||null; }
      catch { return null; }
    }
    function setProgress(text) { document.getElementById('loading-progress').textContent = text; }

    function showError(title, message) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display   = 'flex';
      document.getElementById('error-title').textContent     = title;
      document.getElementById('error-message').textContent   = message;
    }

    function showLoading() {
      document.getElementById('error-state').style.display   = 'none';
      document.getElementById('loading-state').style.display = 'flex';
    }

    // ── Sidebar toggle ──
    let sidebarOpen = true;
    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
      if (pdfInstance && currentZoom === 'fit-width') rerender();
    }

    // ── Sidebar rendering ──
    const TYPE_LABELS = { module: '📚 Modules', pyq: '📋 PYQs', reference: '📎 References' };
    const TYPE_ORDER  = ['module', 'pyq', 'reference'];
    let allModules = [];

    function renderSidebar(modules) {
      allModules = modules;
      const listEl = document.getElementById('sidebar-list');
      if (!modules || modules.length === 0) {
        listEl.innerHTML = '<div style="padding:20px 14px;font-size:12px;color:#6a8aaa;">No files found.</div>';
        return;
      }

      const groups = {};
      for (const m of modules) {
        const t = m.type || 'module';
        if (!groups[t]) groups[t] = [];
        groups[t].push(m);
      }

      let html = '';
      for (const type of TYPE_ORDER) {
        if (!groups[type]) continue;
        html += `<div class="group-label">${TYPE_LABELS[type] || type} (${groups[type].length})</div>`;
        for (const m of groups[type]) {
          const hasFile  = !!(m.has_file ?? m.r2_key);
          const isActive = m.id === fileId;
          const num      = m.module_no ? `M${m.module_no} · ` : '';
          const escapedTitle = escHtml(m.title || 'Untitled');
          const escapedId    = escHtml(m.id);
          const escapedTitleJs = escJs(m.title || 'Untitled');

          html += `
            <div class="sb-item${isActive ? ' active' : ''}${!hasFile ? ' no-file' : ''}"
                 id="sb-${escapedId}"
                 ${hasFile ? `onclick="loadModule('${escapedId}','${escapedTitleJs}')"` : ''}>
              <i class="sb-icon bx ${hasFile ? 'bxs-file-pdf pdf' : 'bx-lock lock'}"></i>
              <span class="sb-title">${escapedTitle}</span>
              ${num ? `<span class="sb-badge">${escHtml(num.replace(' · ',''))}</span>` : ''}
            </div>`;
        }
      }
      listEl.innerHTML = html;
    }

    function setActiveModule(id) {
      document.querySelectorAll('.sb-item.active').forEach(el => el.classList.remove('active'));
      const el = document.getElementById(`sb-${id}`);
      if (el) {
        el.classList.add('active');
        el.scrollIntoView({ block: 'nearest' });
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function escJs(s) {
      return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
    }

    // ── Zoom & page state ──
    let pdfInstance    = null;

    window.addEventListener('scholarsstack-protect-violation', function onProtectViolation() {
      try {
        if (pdfInstance && typeof pdfInstance.destroy === 'function') pdfInstance.destroy();
      } catch (_) {}
      pdfInstance = null;
      const pages = document.getElementById('pdf-pages');
      if (pages) pages.innerHTML = '';
      const wc = document.getElementById('watermark-canvas');
      if (wc) {
        const ctx = wc.getContext('2d');
        if (ctx) ctx.clearRect(0, 0, wc.width, wc.height);
      }
      const tb = document.getElementById('viewer-toolbar');
      if (tb) tb.style.display = 'none';
    });

    let currentZoom    = 'fit-width';
    let currentPageNum = 1;
    const ZOOM_STEPS   = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 3.0];

    // ── Render pages — exact same canvas/ctx.scale pattern as original ──
    async function renderPages(pdf) {
      const container = document.getElementById('pdf-pages');
      const wrapperEl = document.getElementById('viewer-wrapper');
      container.innerHTML = '';

      const dpr        = window.devicePixelRatio || 1;
      const totalPages = pdf.numPages;

      // wrapperEl is always in the layout (not display:none), so clientWidth is always valid
      const availW   = wrapperEl.clientWidth || (window.innerWidth - (sidebarOpen ? 260 : 0));
      const fitWidth = Math.max(availW - 40, 200);

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        if (totalPages > 1) setProgress(`Rendering page ${pageNum} of ${totalPages}…`);

        const page      = await pdf.getPage(pageNum);
        const naturalVP = page.getViewport({ scale: 1 });

        const scale = currentZoom === 'fit-width'
          ? fitWidth / naturalVP.width
          : parseFloat(currentZoom);

        const viewport = page.getViewport({ scale });

        const wrap = document.createElement('div');
        wrap.className = 'pdf-page-wrap';
        wrap.id = `page-${pageNum}`;

        const canvas = document.createElement('canvas');
        canvas.width        = Math.floor(viewport.width  * dpr);
        canvas.height       = Math.floor(viewport.height * dpr);
        canvas.style.width  = Math.floor(viewport.width)  + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);   // HiDPI — same as original

        wrap.appendChild(canvas);
        container.appendChild(wrap);

        await page.render({ canvasContext: ctx, viewport }).promise;
      }
    }

    function revealViewer(pdf) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('viewer-toolbar').style.display = 'flex';
      document.getElementById('total-pages').textContent = pdf.numPages;
      document.getElementById('page-input').max = pdf.numPages;
      currentPageNum = 1;
      syncZoomUI();
      syncPageUI();
    }

    // ── Load PDF via backend stream (Range-aware R2 proxy — pdf.js chunked fetch, not one huge buffer) ──
    async function loadPdf(moduleId) {
      try {
        const streamUrl = `${getApiBase()}/courses/${courseId}/notes/${moduleId}/stream`;
        const authHeaders = { Authorization: `Bearer ${getToken()}` };

        setProgress('Checking file…');
        const probe = await fetch(streamUrl, {
          method: 'GET',
          headers: { ...authHeaders, Range: 'bytes=0-4' },
          credentials: 'omit',
        });

        if (!probe.ok) {
          const data = await probe.json().catch(() => ({}));
          const msgs = {
            not_purchased:     'You have not purchased this course. Buy it first to access the notes.',
            module_not_found:  'This module could not be found.',
            file_not_uploaded: 'PDF not yet uploaded for this module.',
            course_not_found:  'Course not found.'
          };
          showError(
            probe.status === 403 ? 'Access Denied' : 'Not Available',
            msgs[data.error] || data.message || 'Unable to load this document.'
          );
          return;
        }

        const probeCt = (probe.headers.get('content-type') || '').toLowerCase();
        if (probeCt.includes('application/json')) {
          const data = await probe.json().catch(() => ({}));
          const msgs = {
            not_purchased:     'You have not purchased this course. Buy it first to access the notes.',
            module_not_found:  'This module could not be found.',
            file_not_uploaded: 'PDF not yet uploaded for this module.',
            course_not_found:  'Course not found.'
          };
          showError('Not Available', msgs[data.error] || data.message || 'Unable to load this document.');
          return;
        }

        const prefix = new Uint8Array(await probe.arrayBuffer());
        const looksPdf = prefix[0] === 0x25 && prefix[1] === 0x50 && prefix[2] === 0x44 && prefix[3] === 0x46 && prefix[4] === 0x2d;
        if (!looksPdf) {
          showError('Load Error', 'The server did not return a valid PDF. Check that the file exists in R2 and the module id is correct.');
          return;
        }

        let pdfLength = null;
        const cr = probe.headers.get('content-range');
        if (cr) {
          const m = cr.match(/\/(\d+)\s*$/);
          if (m) pdfLength = parseInt(m[1], 10);
        }

        setProgress('Opening document…');
        const loadingTask = pdfjsLib.getDocument({
          url: streamUrl,
          httpHeaders: authHeaders,
          withCredentials: false,
          length: pdfLength != null && !Number.isNaN(pdfLength) ? pdfLength : undefined,
          rangeChunkSize: 524288,
          disableRange: false,
          disableStream: false,
          disableAutoFetch: false,
          cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
          cMapPacked: true,
          isEvalSupported: false,
        });
        loadingTask.onProgress = ({ loaded, total }) => {
          if (!total || total <= 0) return;
          const p = Math.min(100, Math.round((loaded / total) * 100));
          setProgress(`Loading PDF… ${p}%`);
        };

        const pdf = await loadingTask.promise;
        pdfInstance = pdf;

        setProgress('Rendering pages…');
        await renderPages(pdf);
        revealViewer(pdf);

        const email = getUserEmail();
        if (email) drawWatermark(email);

      } catch (err) {
        console.error('PDF render error:', err);
        showError('Load Error', 'Failed to load the document. Please check your connection and try again.');
      }
    }

    // ── Load a module by ID (called from sidebar clicks) ──
    async function loadModule(moduleId, moduleTitle) {
      if (moduleId === fileId && pdfInstance) return;

      fileId = moduleId;
      document.getElementById('file-name').textContent = moduleTitle;
      document.title = `${moduleTitle} — Scholars Stack`;
      setActiveModule(moduleId);

      pdfInstance = null;
      document.getElementById('pdf-pages').innerHTML = '';
      document.getElementById('viewer-toolbar').style.display = 'none';
      document.getElementById('viewer-wrapper').scrollTop = 0;
      setProgress('');
      showLoading();

      loadPdf(moduleId);
    }

    // ── Zoom controls ──
    function zoomStep(dir) {
      const cur = currentZoom === 'fit-width' ? null : parseFloat(currentZoom);
      if (dir > 0) {
        const next = ZOOM_STEPS.find(s => cur === null || s > cur + 0.01);
        if (next) { currentZoom = String(next); rerender(); }
      } else {
        const base = cur === null ? 1.0 : cur;
        const prev = [...ZOOM_STEPS].reverse().find(s => s < base - 0.01);
        if (prev) { currentZoom = String(prev); rerender(); }
      }
    }

    function onZoomSelect(val) { currentZoom = val; rerender(); }

    function syncZoomUI() {
      const sel = document.getElementById('zoom-select');
      sel.value = currentZoom === 'fit-width' ? 'fit-width' : currentZoom;
    }

    let rerenderTimer = null;
    function rerender() {
      syncZoomUI();
      clearTimeout(rerenderTimer);
      rerenderTimer = setTimeout(async () => {
        if (!pdfInstance) return;
        setProgress('Re-rendering…');
        document.getElementById('loading-state').style.display = 'flex';
        await renderPages(pdfInstance);
        document.getElementById('loading-state').style.display = 'none';
        setProgress('');
        syncPageUI();
        const email = getUserEmail();
        if (email) drawWatermark(email);
      }, 80);
    }

    // ── Page navigation ──
    function goToPage(num) {
      if (!pdfInstance) return;
      num = Math.max(1, Math.min(pdfInstance.numPages, num));
      const el = document.getElementById(`page-${num}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      currentPageNum = num;
      syncPageUI();
    }

    function syncPageUI() {
      if (!pdfInstance) return;
      document.getElementById('page-input').value  = currentPageNum;
      document.getElementById('btn-prev').disabled = currentPageNum <= 1;
      document.getElementById('btn-next').disabled = currentPageNum >= pdfInstance.numPages;
    }

    document.getElementById('viewer-wrapper').addEventListener('scroll', () => {
      if (!pdfInstance) return;
      const wrapper = document.getElementById('viewer-wrapper');
      const mid = wrapper.scrollTop + wrapper.clientHeight / 2;
      for (let i = 1; i <= pdfInstance.numPages; i++) {
        const el = document.getElementById(`page-${i}`);
        if (!el) continue;
        if (mid >= el.offsetTop && mid < el.offsetTop + el.offsetHeight) {
          if (currentPageNum !== i) { currentPageNum = i; syncPageUI(); }
          break;
        }
      }
    });

    document.getElementById('page-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { goToPage(parseInt(e.target.value)); e.target.blur(); }
    });
    document.getElementById('page-input').addEventListener('blur', e => {
      const v = parseInt(e.target.value); if (!isNaN(v)) goToPage(v);
    });

    window.addEventListener('resize', () => {
      if (pdfInstance && currentZoom === 'fit-width') rerender();
      const email = getUserEmail();
      if (email) drawWatermark(email);
    });

    // ═══════════════════════════════════════════════════════════
    //  PROTECTION LAYERS — unchanged from original
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('keydown', e => {
      const ctrl = e.ctrlKey || e.metaKey;
      if (e.key === 'PrintScreen') {
        e.preventDefault();
        try { navigator.clipboard.writeText(''); } catch (_) {}
        return;
      }
      if (e.key === 'F12') { e.preventDefault(); return; }
      if (ctrl && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) { e.preventDefault(); return; }
      if (ctrl && e.key.toUpperCase() === 'U') { e.preventDefault(); return; }
      if (ctrl && e.key.toUpperCase() === 'S') { e.preventDefault(); return; }
      if (ctrl && e.key.toUpperCase() === 'P') { e.preventDefault(); return; }
      if (ctrl && e.key.toUpperCase() === 'A') { e.preventDefault(); return; }
      if (ctrl && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomStep(+1); }
      if (ctrl && e.key === '-')  { e.preventDefault(); zoomStep(-1); }
      if (ctrl && e.key === '0')  { e.preventDefault(); currentZoom = 'fit-width'; rerender(); }
    });

    window.addEventListener('beforeprint', e => e.preventDefault());
    window.onbeforeprint = () => false;

    const viewerWrapper = document.getElementById('viewer-wrapper');
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) viewerWrapper.classList.add('blurred');
      else setTimeout(() => viewerWrapper.classList.remove('blurred'), 300);
    });
    document.addEventListener('contextmenu', e => {
      if (e.target.closest('#viewer-wrapper')) e.preventDefault();
    });
    document.addEventListener('dragstart', e => {
      if (e.target.tagName === 'CANVAS') e.preventDefault();
    });

    // ── Watermark ──
    function drawWatermark(email) {
      const canvas = document.getElementById('watermark-canvas');
      function paint() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight - 56;
        const ctx  = canvas.getContext('2d');
        const text = `${email} — Scholars Stack — Personal use only`;
        const size = Math.max(11, Math.min(15, canvas.width / 55));
        ctx.save();
        ctx.globalAlpha = 0.12; ctx.fillStyle = '#ffffff';
        ctx.font = `${size}px Poppins, Arial, sans-serif`;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-28 * Math.PI / 180);
        const sp   = 190;
        const cols = Math.ceil(canvas.width  / sp) + 4;
        const rows = Math.ceil(canvas.height / sp) + 4;
        for (let i = -cols; i <= cols; i++)
          for (let j = -rows; j <= rows; j++)
            ctx.fillText(text, i * sp, j * sp);
        ctx.restore();
      }
      paint();
      window.addEventListener('resize', paint);
    }

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════
    async function init() {
      const token = getToken();
      if (!token) { window.location.href = '/login1.html'; return; }

      if (!courseId || !fileId) {
        showError('Invalid Link', 'This viewer link is missing required parameters.');
        return;
      }

      // Fetch sidebar modules + initial PDF in parallel
      const [modulesResult] = await Promise.allSettled([
        fetch(`${getApiBase()}/courses/${courseId}/modules`, {
          headers: { Authorization: `Bearer ${token}` },
          credentials: 'include'
        }).then(async r => {
          const data = await r.json().catch(() => null);
          return { ok: r.ok, status: r.status, data };
        })
      ]);

      if (modulesResult.status === 'fulfilled' && modulesResult.value?.ok && modulesResult.value?.data?.data) {
        renderSidebar(modulesResult.value.data.data);
        setActiveModule(fileId);
      } else {
        const sidebarMessage =
          modulesResult.status === 'fulfilled'
            ? (modulesResult.value?.data?.message || modulesResult.value?.data?.error || `Could not load file list (${modulesResult.value?.status || 'unknown'})`)
            : 'Could not load file list.';
        document.getElementById('sidebar-list').innerHTML =
          `<div style="padding:20px 14px;font-size:12px;color:#6a8aaa;">${sidebarMessage}</div>`;
      }

      // Load the initial file via stream (no R2 CORS required)
      loadPdf(fileId);
    }

    init();
  </script>
</body>
</html>
