name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 8 */3 * *'  # Every 3 days at 8 AM UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/mess_menu?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Pinged Supabase"
